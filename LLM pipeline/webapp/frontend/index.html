<!DOCTYPE html>
<meta charset="utf-8" />
<title>LLM interprettor</title>
<link rel="stylesheet" href="style.css" />

<div class="shell">
  <header class="topbar">
    <div>
      <div class="title">LLM interprettor</div>
      <div class="subtitle">
        Black Box interpreter: Using a Pre-trained LLM to Explain Black Box
        Model Predictions using in context learning.
      </div>
    </div>
    <div class="status-pill">Live</div>
  </header>

  <main id="log" aria-live="polite"></main>

  <form id="chat" autocomplete="off">
    <textarea
      id="msg"
      placeholder="Ask anything…"
      aria-label="Message"
      rows="2"
      autofocus
    ></textarea>
    <button type="submit">Send</button>
  </form>

  <div class="footer-hint">Using OpenAI model</div>
</div>

<script>
  const log = document.getElementById("log");
  const msg = document.getElementById("msg");
  const API = "/api/chat";
  const RAG_API = "/api/rag_context";
  const systemRole = "You are a helpful assistant.";
  const conversation = [{ role: "system", content: systemRole }];
  let typingEl = null;
  let initialContextSent = false;
  let ragContextPromise = null;
  let ragReady = false;
  let pendingMessage = null;
  let ragStatusShown = false;
  let ragStatusEl = null;
  let ragStatusTimer = null;
  let ragStatusStart = null;

  const scenarioText =
    "Patient A has arrived with the following demographics:\n" +
    "GENDER: M, ETHNICITY: ASIAN, AGE: 70.0\n" +
    "And vitals:\n" +
    ", HR: 84.12, MAP: 78.0, RESP_RATE: 18.0, SPO2: 98.0, TEMP_C: 98.0, FIRST_HEMOGLOBIN: 11.3,\n" +
    "FIRST_CREATININE: 1.0, FIRST_GLUCOSE: 14.0, FIRST_SODIUM: 124.0, FIRST_POTASSIUM:\n" +
    "139.0, FIRST_BICARBONATE: 19.0\n" +
    "The model has predicted it to be a case of 'Low' severity";

  const initialQuestion =
    "Would you like to probe the rationale behind the model's prediction?";

  const explainPrompt =
    `${scenarioText}\n\nDoctor response: {{doctor_response}}\n\n` +
    "Respond as the AI explainer. If the doctor said yes, explain the model's likely rationale based on the " +
    "data above and then ask one concise follow-up question. If the doctor said no, acknowledge briefly and " +
    "ask if they would like a high-level summary instead.";

  const addBubble = (text, who) => {
    const card = document.createElement("div");
    card.className = `bubble ${who}`;
    card.innerText = text;
    log.appendChild(card);
    log.scrollTop = log.scrollHeight;
    return card;
  };

  const showTyping = () => {
    if (typingEl) return;
    const card = document.createElement("div");
    card.className = "bubble bot typing";
    card.setAttribute("aria-label", "Assistant is typing");
    card.innerHTML = `
      <div class="typing-dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
      <span class="typing-text">Typing…</span>
    `;
    typingEl = card;
    log.appendChild(card);
    log.scrollTop = log.scrollHeight;
  };

  const hideTyping = () => {
    if (typingEl) {
      typingEl.remove();
      typingEl = null;
    }
  };

  const sendMessage = async (
    text,
    payloadOverride = null,
    showUserBubble = true
  ) => {
    if (!text) return;
    if (showUserBubble) {
      addBubble(text, "user");
      msg.value = "";
      msg.focus();
    }

    const payload = payloadOverride || text;
    conversation.push({ role: "user", content: payload });

    try {
      showTyping();
      const res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          message: payload,
          role: systemRole,
          messages: conversation,
        }),
      });
      hideTyping();
      if (!res.ok) {
        addBubble(res.status + ": " + res.statusText, "bot");
        return;
      }
      const data = await res.json();
      const replyText = data.reply || res.statusText;
      conversation.push({ role: "assistant", content: replyText });
      addBubble(replyText, "bot");
      initialContextSent = true;
    } catch (err) {
      hideTyping();
      addBubble("Error: " + err.message, "bot");
    }
  };

  document.getElementById("chat").onsubmit = async (e) => {
    e.preventDefault();
    const text = msg.value.trim();
    if (!text) return;
    if (!initialContextSent) {
      if (!ragReady) {
        addBubble(text, "user");
        msg.value = "";
        msg.focus();
        pendingMessage = text;
        if (!ragStatusShown) {
          ragStatusEl = showRagStatus();
          ragStatusShown = true;
        }
        return;
      }
      await sendMessage(text, buildExplainPayload(text));
    } else {
      await sendMessage(text);
    }
  };

  const loadRagContext = async () => {
    try {
      const res = await fetch(RAG_API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ scenario: scenarioText }),
      });
      if (!res.ok) {
        if (ragStatusEl) {
          clearRagStatusTimer();
          ragStatusEl.className = "bubble bot";
          ragStatusEl.innerText =
            "Clustering context failed (" + res.status + "). Continuing without it.";
        } else {
          addBubble(
            "Clustering context failed (" +
              res.status +
              "). Continuing without it.",
            "bot"
          );
        }
        ragReady = true;
        if (pendingMessage) {
          const queued = pendingMessage;
          pendingMessage = null;
          await sendMessage(queued, buildExplainPayload(queued), false);
        }
        return;
      }
      const data = await res.json();
      if (data.context) {
        conversation.push({
          role: "system",
          content: data.context,
        });
      }
      if (ragStatusEl) {
        clearRagStatusTimer();
        ragStatusEl.remove();
        ragStatusEl = null;
      }
      ragReady = true;
      if (pendingMessage) {
        const queued = pendingMessage;
        pendingMessage = null;
        await sendMessage(queued, buildExplainPayload(queued), false);
      }
    } catch (err) {
      if (ragStatusEl) {
        clearRagStatusTimer();
        ragStatusEl.className = "bubble bot";
        ragStatusEl.innerText =
          "Clustering context failed (" +
          err.message +
          "). Continuing without it.";
      } else {
        addBubble(
          "Clustering context failed (" +
            err.message +
            "). Continuing without it.",
          "bot"
        );
      }
      ragReady = true;
      if (pendingMessage) {
        const queued = pendingMessage;
        pendingMessage = null;
        await sendMessage(queued, buildExplainPayload(queued), false);
      }
      return;
    }
  };

  const showRagStatus = () => {
    const card = document.createElement("div");
    card.className = "bubble bot typing";
    card.setAttribute("aria-label", "Preparing clustering context");
    card.innerHTML = `
      <div class="typing-dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
      <span class="typing-text">Preparing clustering context - Only one time build (elapsed 0s)</span>
    `;
    log.appendChild(card);
    log.scrollTop = log.scrollHeight;
    ragStatusStart = Date.now();
    ragStatusTimer = window.setInterval(() => {
      const elapsed = Math.floor((Date.now() - ragStatusStart) / 1000);
      const label = card.querySelector(".typing-text");
      if (label) {
        label.textContent =
          "Preparing clustering context (elapsed " + elapsed + "s)";
      }
    }, 1000);
    return card;
  };

  const clearRagStatusTimer = () => {
    if (ragStatusTimer) {
      clearInterval(ragStatusTimer);
      ragStatusTimer = null;
    }
    ragStatusStart = null;
  };

  const buildExplainPayload = (doctorResponse) =>
    explainPrompt.replace("{{doctor_response}}", doctorResponse);

  window.addEventListener("DOMContentLoaded", () => {
    addBubble(scenarioText, "bot");
    addBubble(initialQuestion, "bot");
    ragContextPromise = loadRagContext();
  });
</script>
